<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Auth System</title>
    <link rel="stylesheet" href="CSS/style.css" />
  </head>
  <body>
    <div class="auth-container" id="authContainer">
      <!-- Register Side -->
      <div class="form-box register">
        <form id="regForm">
          <h2>Create Account</h2>
          <div class="input-field">
            <input type="text" id="rName" required placeholder="Full Name" />
          </div>
          <div class="input-field">
            <input
              type="email"
              id="rEmail"
              required
              placeholder="Email Address"
            />
          </div>
          <div class="input-field">
            <input type="password" id="rPass" required placeholder="Password" />
          </div>
          <button type="submit" class="btn">Register</button>
          <p>Already have an account? <a href="#" id="showLogin">Login</a></p>
        </form>
      </div>

      <!-- Login Side -->
      <div class="form-box login">
        <form id="logForm">
          <h2>Welcome Back</h2>
          <div class="input-field">
            <input type="email" id="lEmail" required placeholder="Email" />
          </div>
          <div class="input-field">
            <input type="password" id="lPass" required placeholder="Password" />
          </div>
          <button type="submit" class="btn">Sign In</button>
          <p>New user? <a href="#" id="showReg">Create Account</a></p>
        </form>
      </div>
    </div>
    <script src="js/registerlogin.js"></script>
  </body>
</html>
