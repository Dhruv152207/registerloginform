<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="CSS/style.css" />
  </head>
  <body
    class="bg-primary-subtle min-vh-100 d-flex align-items-center justify-content-center p-3"
  >
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-5">
          <div class="card shadow-lg border-0 rounded-4">
            <div class="card-body p-4 p-md-5">
              <h2 class="fw-bold text-center mb-4">Welcome Back</h2>
              <form id="logForm">
                <div class="mb-3">
                  <label for="lIdentifier" class="form-label"
                    >Username or Email</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="lIdentifier"
                    required
                    placeholder="Enter your username or email"
                  />
                </div>
                <div class="mb-3">
                  <label for="lPass" class="form-label">Password</label>
                  <input
                    type="password"
                    class="form-control"
                    id="lPass"
                    required
                    placeholder="Enter your password"
                  />
                </div>
                <button type="submit" class="btn btn-primary w-100">
                  Sign In
                </button>
                <p class="text-center mt-3 mb-2">
                  New user?
                  <a href="register.html">Create Account</a>
                </p>
                <p class="text-center mb-0">
                  <a href="index.html">Back</a>
                </p>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="JS/registerlogin.js"></script>
  </body>
</html>
