<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="CSS/style.css" />
  </head>
  <body
    class="bg-primary-subtle min-vh-100 d-flex align-items-center justify-content-center p-3"
  >
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-7 col-lg-6">
          <div class="card shadow-lg border-0 rounded-4">
            <div class="card-body p-4 p-md-5">
              <h2 class="fw-bold text-center mb-4">Create Account</h2>
              <form id="regForm">
                <div class="mb-3">
                  <label for="rUsername" class="form-label">Username</label>
                  <input
                    type="text"
                    class="form-control"
                    id="rUsername"
                    required
                    placeholder="Choose a username"
                  />
                </div>
                <div class="mb-3">
                  <label for="rFullName" class="form-label">Full Name</label>
                  <input
                    type="text"
                    class="form-control"
                    id="rFullName"
                    required
                    placeholder="Enter your full name"
                  />
                </div>
                <div class="mb-3">
                  <label for="rEmail" class="form-label">Email Address</label>
                  <input
                    type="email"
                    class="form-control"
                    id="rEmail"
                    required
                    placeholder="Enter your email"
                  />
                </div>
                <div class="mb-3">
                  <label for="rPass" class="form-label">Password</label>
                  <input
                    type="password"
                    class="form-control"
                    id="rPass"
                    required
                    placeholder="Create a password"
                  />
                </div>
                <div class="mb-3">
                  <label for="rConfirmPass" class="form-label"
                    >Confirm Password</label
                  >
                  <input
                    type="password"
                    class="form-control"
                    id="rConfirmPass"
                    required
                    placeholder="Confirm your password"
                  />
                </div>
                <button type="submit" class="btn btn-primary w-100">
                  Register
                </button>
                <p class="text-center mt-3 mb-2">
                  Already have an account? <a href="login.html">Login</a>
                </p>
                <p class="text-center mb-0">
                  <a href="index.html">Back</a>
                </p>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="JS/registerlogin.js"></script>
  </body>
</html>
