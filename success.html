<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Success</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="CSS/style.css" />
  </head>
  <body
    class="bg-primary-subtle min-vh-100 d-flex align-items-center justify-content-center p-3"
  >
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-5">
          <div class="card shadow-lg border-0 rounded-4 text-center">
            <div class="card-body p-4 p-md-5">
              <h2 class="fw-bold mb-3">Login Successful</h2>
              <p id="welcomeText" class="text-muted mb-3">Welcome!</p>
              <p class="text-muted mb-4">You are successfully logged in.</p>
              <a href="index.html" class="btn btn-primary">Go Home</a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const name = sessionStorage.getItem("welcomeName") || "User";
      document.getElementById("welcomeText").textContent = `Welcome, ${name}!`;
    </script>
  </body>
</html>
